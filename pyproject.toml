[project]
name = "mcp-guard"
version = "0.1.0"
description = "Empirical study: regex/heuristic vs. fine-tuned DistilBERT prompt-injection detection on MCP tool outputs"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.2.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
train = [
    "torch>=2.4",
    "transformers>=4.44",
    "datasets>=2.20",
    "accelerate>=0.33",
    "scikit-learn>=1.5",
    "pandas>=2.2",
]
eval = [
    "scikit-learn>=1.5",
    "pandas>=2.2",
    "matplotlib>=3.9",
]
serve = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "streamlit>=1.38",
    "pandas>=2.2",
    "matplotlib>=3.9",
]
# Note: SQLite logging uses the stdlib `sqlite3` module (WAL mode) — no extra dep.

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.uv]
default-groups = ["dev"]

# Torch source is platform-aware:
#   * Windows -> CPU wheel (~200MB) from the pytorch-cpu index (low-bandwidth setup).
#     To use the RTX 3050 later, swap the marker'd line to index "pytorch-cu124".
#   * macOS / Linux -> default PyPI wheel. On Apple Silicon (M-series) that wheel
#     includes Metal/MPS GPU support, so training auto-accelerates on a Mac.
[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_guard"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# This project deliberately embeds obfuscated Unicode (zero-width chars, Cyrillic
# homoglyphs, bidi overrides) as injection payloads, so the ambiguous-Unicode and
# control-character rules are expected here rather than defects.
ignore = ["RUF001", "RUF002", "RUF003", "PLE2515", "PLE2502"]
